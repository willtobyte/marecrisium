name: macOS

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - CMakeLists.txt
      - conanfile.py
      - recipes/**
      - .github/**

jobs:
  build:
    runs-on: macos-latest

    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: |
            tools/pack.py
            assets/tools/*.py

      - name: Setup Conan
        run: |
          uv tool install conan
          uv tool run conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'src/**') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ runner.arch }}-

      - name: Export local recipes
        run: |
          uv tool run conan export recipes/luajit --version=2.1-20260908

      - name: Install dependencies
        env:
          COMPILE_FLAGS: '["-O2", "-g", "-mcpu=apple-m1", "-fno-omit-frame-pointer", "-fno-optimize-sibling-calls", "-flto=thin"]'
        run: >-
          uv tool run conan install . --output-folder=build --build="*"
          --profile:all=.github/conan/macos
          --conf:all="tools.build:cflags=$COMPILE_FLAGS"
          --conf:all="tools.build:cxxflags=$COMPILE_FLAGS"
          --conf:all="libcurl/*:tools.build:cflags=${COMPILE_FLAGS/-flto=thin/-fno-lto}"
          --conf:all="libcurl/*:tools.build:cxxflags=${COMPILE_FLAGS/-flto=thin/-fno-lto}"
          --conf:all='tools.build:exelinkflags=["-flto=thin"]'
          --conf:all='tools.cmake.cmaketoolchain:extra_variables={"CMAKE_C_FLAGS_RELEASE": "-DNDEBUG", "CMAKE_CXX_FLAGS_RELEASE": "-DNDEBUG", "CMAKE_OBJC_FLAGS_RELEASE": "-DNDEBUG", "CMAKE_OBJCXX_FLAGS_RELEASE": "-DNDEBUG"}'

      - name: Build
        run: |
          cmake -Bbuild \
            -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-Wl,-object_path_lto,${{ github.workspace }}/build/carimbo.lto.o" \
            -DVERSION="${{ github.sha }}"
          cmake --build build --config Release --parallel "$(uv run --no-project python -c 'import os; print(os.cpu_count())')" --verbose

      - name: Setup Sentry CLI
        run: npm install --global @sentry/cli@latest

      - name: Generate symbols and strip binary
        run: |
          dsymutil --verify build/carimbo -o build/carimbo.dSYM
          sentry-cli debug-files bundle-sources build/carimbo.dSYM --output build
          test -s build/carimbo.src.zip
          uv tool run conan cache clean "*" --build --temp
          strip build/carimbo

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: macos-symbols
          path: |
            build/carimbo.dSYM
            build/carimbo.src.zip
          if-no-files-found: error

      - name: Generate assets
        run: uv run assets/tools/run.py

      - name: Package cartridge
        run: uv run tools/pack.py cartridge

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          cp build/carimbo artifact/
          cp cartridge.rom artifact/
          cp tools/pack.py artifact/
          cp tools/unpack.py artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: artifact/
