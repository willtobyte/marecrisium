name: Publish Steam

on:
  push:
    tags:
      - "v*.*.*"

env:
  MSYS_NO_PATHCONV: 1

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: tools/pack.py

      - name: Setup Conan
        run: |
          uv tool install conan
          uv tool run conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'src/**') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ runner.arch }}-

      - name: Export local recipes
        run: |
          uv tool run conan export recipes/luajit --version=2.1-20260908

      - name: Install dependencies
        env:
          COMPILE_FLAGS: '["-O2", "-g", "-mcpu=apple-m1", "-fno-omit-frame-pointer", "-fno-optimize-sibling-calls", "-flto=thin"]'
        run: >-
          uv tool run conan install . --output-folder=build --build="*"
          --profile:all=.github/conan/macos
          --conf:all="tools.build:cflags=$COMPILE_FLAGS"
          --conf:all="tools.build:cxxflags=$COMPILE_FLAGS"
          --conf:all="libcurl/*:tools.build:cflags=${COMPILE_FLAGS/-flto=thin/-fno-lto}"
          --conf:all="libcurl/*:tools.build:cxxflags=${COMPILE_FLAGS/-flto=thin/-fno-lto}"
          --conf:all='tools.build:exelinkflags=["-flto=thin"]'
          --conf:all='tools.cmake.cmaketoolchain:extra_variables={"CMAKE_C_FLAGS_RELEASE": "-DNDEBUG", "CMAKE_CXX_FLAGS_RELEASE": "-DNDEBUG", "CMAKE_OBJC_FLAGS_RELEASE": "-DNDEBUG", "CMAKE_OBJCXX_FLAGS_RELEASE": "-DNDEBUG"}'

      - name: Build
        run: |
          cmake -Bbuild \
            -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-Wl,-object_path_lto,${{ github.workspace }}/build/carimbo.lto.o" \
            -DVERSION="${{ github.ref_name }}"
          cmake --build build --config Release --parallel "$(uv run --no-project python -c 'import os; print(os.cpu_count())')" --verbose

      - name: Setup Sentry CLI
        run: npm install --global @sentry/cli@latest

      - name: Generate symbols and strip binary
        run: |
          dsymutil --verify build/carimbo -o build/carimbo.dSYM
          sentry-cli debug-files bundle-sources build/carimbo.dSYM --output build
          test -s build/carimbo.src.zip
          uv tool run conan cache clean "*" --build --temp
          strip build/carimbo

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: macos-symbols
          path: |
            build/carimbo.dSYM
            build/carimbo.src.zip
          if-no-files-found: error

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          cp build/carimbo artifact/
          cp build/LICENSES artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: artifact/

  windows:
    runs-on: windows-latest

    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: tools/pack.py

      - name: Setup Conan
        run: |
          uv tool install conan
          uv tool run conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'src/**') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ runner.arch }}-

      - name: Export local recipes
        run: |
          uv tool run conan export recipes/luajit --version=2.1-20260908

      - name: Install dependencies
        env:
          COMPILE_FLAGS: '["/O2", "/Zi", "/GL"]'
        run: >-
          uv tool run conan install . --output-folder=build --build="*"
          --profile:all=.github/conan/windows
          --conf:all="tools.build:cflags=$COMPILE_FLAGS"
          --conf:all="tools.build:cxxflags=$COMPILE_FLAGS"
          --conf:all='tools.build:exelinkflags=["/DEBUG:FULL", "/OPT:REF", "/OPT:NOICF", "/INCREMENTAL:NO", "/LTCG"]'
          --conf:all='tools.cmake.cmaketoolchain:extra_variables={"CMAKE_MSVC_DEBUG_INFORMATION_FORMAT": "ProgramDatabase"}'

      - name: Build
        run: |
          cmake -Bbuild \
            -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DVERSION="${{ github.ref_name }}"
          cmake --build build --config Release --parallel "$(uv run --no-project python -c 'import os; print(os.cpu_count())')" --verbose

      - name: Setup Sentry CLI
        run: npm install --global @sentry/cli@latest

      - name: Bundle symbol sources
        run: |
          sentry-cli debug-files bundle-sources build/Release/carimbo.pdb --output build/Release
          test -s build/Release/carimbo.src.zip
          uv tool run conan cache clean "*" --build --temp

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: windows-symbols
          path: |
            build/Release/carimbo.pdb
            build/Release/carimbo.src.zip
          if-no-files-found: error

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          cp build/Release/carimbo.exe artifact/
          cp build/LICENSES artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: artifact/

  symbols:
    runs-on: ubuntu-latest
    needs: [macos, windows]

    steps:
      - name: Download macOS symbols
        uses: actions/download-artifact@v8
        with:
          name: macos-symbols
          path: symbols/macos

      - name: Download Windows symbols
        uses: actions/download-artifact@v8
        with:
          name: windows-symbols
          path: symbols/windows

      - name: Setup Sentry CLI
        run: npm install --global @sentry/cli@latest

      - name: Send symbols to Sentry
        run: sentry-cli debug-files upload --wait symbols
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

  publish:
    runs-on: ubuntu-latest
    needs: [macos, windows, symbols]

    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download macOS build
        uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: macos-build

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: windows-build

      - name: Clone Steam SDK
        run: gh repo clone willtobyte/steamworks steamworks -- --depth 1
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: |
            tools/pack.py
            assets/tools/*.py

      - name: Generate assets
        run: uv run assets/tools/run.py

      - name: Package cartridge
        run: uv run tools/pack.py cartridge

      - name: Assemble output
        run: |
          mkdir -p output/{content,macos,windows}

          cp cartridge.rom output/content/
          cp assets/sentry.dsn output/content/
          echo "$VERSION" > output/content/VERSION

          cp macos-build/carimbo output/macos/
          cp macos-build/LICENSES output/macos/
          cp steamworks/redistributable_bin/osx/libsteam_api.dylib output/macos/

          cp windows-build/carimbo.exe output/windows/
          cp windows-build/LICENSES output/windows/
          cp steamworks/redistributable_bin/win64/steam_api64.dll output/windows/

      - name: Upload to Steam
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ secrets.STEAM_APP_ID }}
          buildDescription: ${{ env.VERSION }}
          rootPath: output
          firstDepotIdOverride: 4537491
          depot1Path: content
          depot2Path: windows
          depot3Path: macos
          releaseBranch: alpha
