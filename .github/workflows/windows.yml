name: Windows

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - CMakeLists.txt
      - conanfile.py
      - recipes/**
      - .github/**

jobs:
  build:
    runs-on: windows-latest

    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      MSYS_NO_PATHCONV: 1

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: |
            tools/pack.py
            assets/tools/*.py

      - name: Setup Conan
        run: |
          uv tool install conan
          uv tool run conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'src/**') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ runner.arch }}-

      - name: Export local recipes
        run: |
          uv tool run conan export recipes/luajit --version=2.1-20260908

      - name: Install dependencies
        env:
          COMPILE_FLAGS: '["/O2", "/Zi", "/GL"]'
        run: >-
          uv tool run conan install . --output-folder=build --build="*"
          --profile:all=.github/conan/windows
          --conf:all="tools.build:cflags=$COMPILE_FLAGS"
          --conf:all="tools.build:cxxflags=$COMPILE_FLAGS"
          --conf:all='tools.build:exelinkflags=["/DEBUG:FULL", "/OPT:REF", "/OPT:NOICF", "/INCREMENTAL:NO", "/LTCG"]'
          --conf:all='tools.cmake.cmaketoolchain:extra_variables={"CMAKE_C_FLAGS_RELEASE": "/DNDEBUG", "CMAKE_CXX_FLAGS_RELEASE": "/DNDEBUG", "CMAKE_MSVC_DEBUG_INFORMATION_FORMAT": "ProgramDatabase"}'

      - name: Build
        run: |
          cmake -Bbuild \
            -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DVERSION="${{ github.sha }}"
          cmake --build build --config Release --verbose

      - name: Setup Sentry CLI
        run: npm install --global @sentry/cli@latest

      - name: Bundle symbol sources
        run: |
          sentry-cli debug-files bundle-sources build/Release/carimbo.pdb --output build/Release
          test -s build/Release/carimbo.src.zip
          uv tool run conan cache clean "*" --build --temp

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: windows-symbols
          path: |
            build/Release/carimbo.pdb
            build/Release/carimbo.src.zip
          if-no-files-found: error

      - name: Generate assets
        run: uv run assets/tools/run.py

      - name: Package cartridge
        run: uv run tools/pack.py cartridge

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          cp build/Release/carimbo.exe artifact/
          cp cartridge.rom artifact/
          cp tools/pack.py artifact/
          cp tools/unpack.py artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: artifact/
